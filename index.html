<!DOCTYPE html>
<html>
<head>
  <title>My ToDo List</title>
  <style>
    body {
      font-family: 'Verdana', sans-serif;
      background: linear-gradient(to right, #ffecd2, #fcb69f);
      text-align: center;
      margin-top: 60px;
    }

    .todo-box {
      background: #fff;
      width: 300px;
      margin: auto;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    h2 {
      color: #ff6600;
    }

    input {
      width: 70%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: #ff6600;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #e65c00;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 15px;
    }

    li {
      background: #ffe6cc;
      margin: 5px 0;
      padding: 8px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .done {
      text-decoration: line-through;
      color: gray;
    }

    .del-btn {
      background-color: #ff3333;
      border: none;
      color: white;
      padding: 4px 6px;
      border-radius: 3px;
      cursor: pointer;
    }

    .del-btn:hover {
      background-color: #cc0000;
    }
  </style>
</head>
<body>

  <div class="todo-box">
    <h2>My ToDo List</h2>
    <input type="text" id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>
    <ul id="taskList"></ul>
  </div>

  <script>
    function addTask() {
      let input = document.getElementById("taskInput");
      let text = input.value.trim();
      if (text === "") return;

      let li = document.createElement("li");
      li.textContent = text;

      li.onclick = function() {
        li.classList.toggle("done");
      };

      let del = document.createElement("button");
      del.textContent = "X";
      del.className = "del-btn";
      del.onclick = function(e) {
        e.stopPropagation(); // Prevent mark done when deleting
        li.remove();
      };

      li.appendChild(del);
      document.getElementById("taskList").appendChild(li);
      input.value = "";
    }
  </script>

</body>
</html>
